name: Compilar Plantão na Mão iOS 1.6

on:
  push:
    branches: [main]
    paths:
      - 'PlantaoNaMao/**'
      - 'PlantaoNaMaoTests/**'
      - 'PlantaoNaMaoWidgets/**'
      - 'PlantaoNaMaoUITests/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Validar e compilar iOS
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Selecionar Xcode 26 para Liquid Glass
        run: bash scripts/select-xcode.sh
      - name: Verificar cálculos, pagamentos, migração e ícone
        run: |
          bash scripts/check-models.sh
          python3 scripts/generate-icon.py
      - name: Preparar XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          xcodegen generate
      - name: Selecionar simulador iOS 26
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 scripts/select-simulator.py)
          echo "IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Inicializar simulador iOS
        timeout-minutes: 5
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
      - name: Compilar app e testes para o simulador
        run: |
          xcodebuild build-for-testing \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Testar dados, PDFs e sincronização
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -only-testing:PlantaoNaMaoTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 150 \
            -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Testar calendário fixo e acesso a Ajustes
        timeout-minutes: 8
        run: |
          xcodebuild test-without-building \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -only-testing:PlantaoNaMaoUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 240 \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Compilar arquivo para iPhone e iPad
        run: |
          xcodebuild archive \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PlantaoNaMao.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Extrair capturas dos testes de interface
        if: always()
        run: |
          for RESULT in build/*.xcresult; do
            if [ -d "$RESULT" ]; then
              NAME=$(basename "$RESULT" .xcresult)
              xcrun xcresulttool export attachments --path "$RESULT" --output-path "build/Screenshots/$NAME" || true
            fi
          done
      - name: Empacotar IPA sem assinatura e projeto Xcode
        run: |
          mkdir -p build/package/Payload
          ditto build/PlantaoNaMao.xcarchive/Products/Applications/PlantaoNaMao.app build/package/Payload/PlantaoNaMao.app
          test -d build/package/Payload/PlantaoNaMao.app/PlugIns/PlantaoNaMaoWidgets.appex
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/package/Payload/PlantaoNaMao.app/Info.plist)" = '1.6'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/package/Payload/PlantaoNaMao.app/PlugIns/PlantaoNaMaoWidgets.appex/Info.plist)" = '1.6'
          ditto -c -k --keepParent build/package/Payload build/PlantaoNaMao-1.6-sem-assinatura.ipa
          ditto -c -k --keepParent PlantaoNaMao.xcodeproj build/PlantaoNaMao-Xcode.zip
          cat > build/LEIA-ME.txt <<'TXT'
          Plantão na Mão 1.6
          O IPA deste workflow NÃO está assinado. Para instalar em um iPhone/iPad,
          assine com uma conta/equipe Apple e um perfil de provisionamento válido.
          Para TestFlight/App Store, abra o projeto no Xcode, configure Signing &
          Capabilities e use Product > Archive > Distribute App.
          TXT
      - name: Disponibilizar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-testes
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar compilação iOS 1.6
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-iOS-1.6-sem-assinatura
          path: |
            build/PlantaoNaMao-1.6-sem-assinatura.ipa
            build/PlantaoNaMao-Xcode.zip
            build/LEIA-ME.txt
          if-no-files-found: error
          retention-days: 14
      - name: Disponibilizar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-1.6-telas
          path: build/Screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Resumo
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Plantão na Mão iOS 1.6
          - Testes de pagamentos, migração e PDFs executados no simulador.
          - Compilação Release para iPhone/iPad concluída.
          - Baixe o IPA **sem assinatura** e o projeto Xcode em **Artifacts**.
          - Para instalar ou distribuir, configure a assinatura Apple no Xcode.
          MD


  release-ipa:
    name: Gerar IPA iOS 1.6
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Selecionar Xcode 26
        run: bash scripts/select-xcode.sh
      - name: Validar regras e gerar projeto Xcode
        run: |
          bash scripts/check-models.sh
          python3 scripts/generate-icon.py
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Compilar Release para iPhone e iPad
        run: |
          xcodebuild archive \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Release.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Empacotar IPA 1.6
        run: |
          mkdir -p build/package/Payload
          ditto build/Release.xcarchive/Products/Applications/PlantaoNaMao.app build/package/Payload/PlantaoNaMao.app
          test -d build/package/Payload/PlantaoNaMao.app/PlugIns/PlantaoNaMaoWidgets.appex
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/package/Payload/PlantaoNaMao.app/Info.plist)" = '1.6'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/package/Payload/PlantaoNaMao.app/PlugIns/PlantaoNaMaoWidgets.appex/Info.plist)" = '1.6'
          ditto -c -k --keepParent build/package/Payload build/PlantaoNaMao-1.6-sem-assinatura.ipa
          ditto -c -k --keepParent PlantaoNaMao.xcodeproj build/PlantaoNaMao-Xcode.zip
      - name: Disponibilizar IPA e projeto
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-iOS-1.6-IPA
          path: |
            build/PlantaoNaMao-1.6-sem-assinatura.ipa
            build/PlantaoNaMao-Xcode.zip
          if-no-files-found: error
          retention-days: 30

