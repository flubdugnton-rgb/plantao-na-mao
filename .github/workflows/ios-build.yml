name: Compilar Plantão na Mão iOS 1.1

on:
  push:
    branches: [main]
    paths:
      - 'PlantaoNaMao/**'
      - 'PlantaoNaMaoTests/**'
      - 'PlantaoNaMaoUITests/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Validar e compilar iOS
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Selecionar Xcode 26 para Liquid Glass
        run: bash scripts/select-xcode.sh
      - name: Verificar cálculos, pagamentos e migração
        run: bash scripts/check-models.sh
      - name: Preparar XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          xcodegen generate
      - name: Selecionar simulador iOS 26
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 scripts/select-simulator.py)
          echo "IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Compilar app e testes para o simulador
        run: |
          xcodebuild build-for-testing \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Testar no simulador iOS
        run: |
          xcodebuild test-without-building \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 150 \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Compilar arquivo para iPhone e iPad
        run: |
          xcodebuild archive \
            -project PlantaoNaMao.xcodeproj \
            -scheme PlantaoNaMao \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PlantaoNaMao.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Extrair capturas dos testes de interface
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/Screenshots || true
          fi
      - name: Empacotar IPA sem assinatura e projeto Xcode
        run: |
          mkdir -p build/package/Payload
          ditto build/PlantaoNaMao.xcarchive/Products/Applications/PlantaoNaMao.app build/package/Payload/PlantaoNaMao.app
          ditto -c -k --keepParent build/package/Payload build/PlantaoNaMao-1.1-sem-assinatura.ipa
          ditto -c -k --keepParent PlantaoNaMao.xcodeproj build/PlantaoNaMao-Xcode.zip
          cat > build/LEIA-ME.txt <<'TXT'
          Plantão na Mão 1.1
          O IPA deste workflow NÃO está assinado. Para instalar em um iPhone/iPad,
          assine com uma conta/equipe Apple e um perfil de provisionamento válido.
          Para TestFlight/App Store, abra o projeto no Xcode, configure Signing &
          Capabilities e use Product > Archive > Distribute App.
          TXT
      - name: Disponibilizar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-testes
          path: build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar compilação iOS 1.1
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-iOS-1.1-sem-assinatura
          path: |
            build/PlantaoNaMao-1.1-sem-assinatura.ipa
            build/PlantaoNaMao-Xcode.zip
            build/LEIA-ME.txt
          if-no-files-found: error
          retention-days: 14
      - name: Disponibilizar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-1.1-telas
          path: build/Screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Resumo
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Plantão na Mão iOS 1.1
          - Testes de pagamentos, migração e PDFs executados no simulador.
          - Compilação Release para iPhone/iPad concluída.
          - Baixe o IPA **sem assinatura** e o projeto Xcode em **Artifacts**.
          - Para instalar ou distribuir, configure a assinatura Apple no Xcode.
          MD
