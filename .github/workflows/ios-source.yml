name: Extrair projeto iOS 1.0 automaticamente

on:
  push:
    branches: [main]
    paths:
      - 'PlantaoNaMao/**'
      - 'PlantaoNaMaoTests/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'project.yml'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-project:
    name: Gerar projeto Xcode e pacote de fontes
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4
      - name: Gerar projeto iOS
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Organizar projeto completo
        run: |
          mkdir -p build/PlantaoNaMao-iOS-1.0/.github
          cp -R PlantaoNaMao PlantaoNaMaoTests Tests scripts project.yml README.md PlantaoNaMao.xcodeproj build/PlantaoNaMao-iOS-1.0/
          cp -R .github/workflows build/PlantaoNaMao-iOS-1.0/.github/
          cp .gitignore build/PlantaoNaMao-iOS-1.0/
          ditto -c -k --keepParent build/PlantaoNaMao-iOS-1.0 build/PlantaoNaMao-iOS-1.0-projeto-completo.zip
      - name: Disponibilizar projeto extraído
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoNaMao-iOS-1.0-projeto-completo
          path: build/PlantaoNaMao-iOS-1.0-projeto-completo.zip
          if-no-files-found: error
          retention-days: 30
