name: PlantaoNaMao
options:
  bundleIdPrefix: com.plantaonamao
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: '17.0'
    macOS: '26.0'
  xcodeVersion: '26.0'
packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    exactVersion: '3.0.0'
  GTMAppAuth:
    url: https://github.com/google/GTMAppAuth
    exactVersion: '6.0.0'
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: '10.1.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '1.6'
    CURRENT_PROJECT_VERSION: '8'
    TARGETED_DEVICE_FAMILY: '1,2'
    APP_GROUP_IDENTIFIER: group.com.plantaonamao.shared
targets:
  PlantaoNaMao:
    type: application
    platform: iOS
    sources:
      - path: PlantaoNaMao
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: PlantaoNaMaoWidgets
        embed: true
    entitlements:
      path: PlantaoNaMao/Plantao.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)", "$(AppIdentifierPrefix)com.plantaonamao.widget"]
    info:
      path: PlantaoNaMao/Info.plist
      properties:
        CFBundleDisplayName: Plantão na Mão
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pt_BR
        CFBundleLocalizations: [pt_BR]
        SharedAppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        SharedKeychainAccessGroup: "$(AppIdentifierPrefix)com.plantaonamao.widget"
        GIDClientID: 240965240632-fd5s8htiparn8kk84rpctc1ggrfrur2g.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes: [plantaonamao]
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.240965240632-fd5s8htiparn8kk84rpctc1ggrfrur2g
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app
        PRODUCT_NAME: PlantaoNaMao
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Plantão na Mão
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PlantaoNaMaoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PlantaoNaMaoWidgets
      - path: PlantaoNaMao/Models.swift
      - path: PlantaoNaMao/FinanceModels.swift
      - path: PlantaoNaMao/WidgetData.swift
      - path: PlantaoNaMao/WidgetKeychain.swift
      - path: PlantaoNaMao/ColorPalette.swift
    entitlements:
      path: PlantaoNaMaoWidgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)", "$(AppIdentifierPrefix)com.plantaonamao.widget"]
    info:
      path: PlantaoNaMaoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plantão na Mão
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SharedAppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        SharedKeychainAccessGroup: "$(AppIdentifierPrefix)com.plantaonamao.widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app.widgets
        PRODUCT_NAME: PlantaoNaMaoWidgets
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  PlantaoNaMaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlantaoNaMaoTests
    dependencies:
      - target: PlantaoNaMao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app.tests
        GENERATE_INFOPLIST_FILE: YES
  PlantaoNaMaoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlantaoNaMaoUITests
    dependencies:
      - target: PlantaoNaMao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app.uitests
        GENERATE_INFOPLIST_FILE: YES
  PlantaoNaMaoMac:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: PlantaoNaMaoMac
      - path: PlantaoNaMao
        excludes: [App.swift, GoogleSyncController.swift, SettingsView.swift, GlassStyle.swift, Assets.xcassets, Info.plist, Plantao.entitlements]
    dependencies:
      - package: AppAuth
        product: AppAuth
      - package: GTMAppAuth
        product: GTMAppAuth
      - target: PlantaoNaMaoMacWidgets
        embed: true
    preBuildScripts:
      - name: Preparar ícone original para macOS
        script: python3 "$SRCROOT/scripts/prepare-macos-icon.py"
        basedOnDependencyAnalysis: false
    entitlements:
      path: PlantaoNaMaoMac/PlantaoMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)", "$(AppIdentifierPrefix)com.plantaonamao.widget"]
    info:
      path: PlantaoNaMaoMac/Info.plist
      properties:
        CFBundleDisplayName: Plantão na Mão
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pt_BR
        CFBundleLocalizations: [pt_BR]
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Plantão na Mão
        SharedAppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        SharedKeychainAccessGroup: "$(AppIdentifierPrefix)com.plantaonamao.widget"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [plantaonamao]
          - CFBundleURLSchemes: [com.googleusercontent.apps.240965240632-g58uffmvvthdqa1mk513fd4k8m8jml2v]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.macos
        PRODUCT_NAME: PlantaoNaMao
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: ''
  PlantaoNaMaoMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: PlantaoNaMaoWidgets/PlantaoWidgets.swift
      - path: PlantaoNaMao/Models.swift
      - path: PlantaoNaMao/FinanceModels.swift
      - path: PlantaoNaMao/WidgetData.swift
      - path: PlantaoNaMao/WidgetKeychain.swift
      - path: PlantaoNaMao/ColorPalette.swift
      - path: PlantaoNaMao/PlatformUI.swift
    entitlements:
      path: PlantaoNaMaoMacWidgets/Widgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)", "$(AppIdentifierPrefix)com.plantaonamao.widget"]
    info:
      path: PlantaoNaMaoMacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plantão na Mão
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SharedAppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        SharedKeychainAccessGroup: "$(AppIdentifierPrefix)com.plantaonamao.widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.macos.widgets
        PRODUCT_NAME: PlantaoNaMaoMacWidgets
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: ''
  PlantaoNaMaoMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: PlantaoNaMaoMacTests
      - path: PlantaoNaMaoTests
      - path: PlantaoNaMao/Models.swift
      - path: PlantaoNaMao/FinanceModels.swift
      - path: PlantaoNaMao/SyncModels.swift
      - path: PlantaoNaMao/SyncCheckpoint.swift
      - path: PlantaoNaMao/GoogleCloudConfiguration.swift
      - path: PlantaoNaMao/GoogleDriveSync.swift
      - path: PlantaoNaMao/Store.swift
      - path: PlantaoNaMao/WidgetBridge.swift
      - path: PlantaoNaMao/WidgetData.swift
      - path: PlantaoNaMao/WidgetKeychain.swift
      - path: PlantaoNaMao/ColorPalette.swift
      - path: PlantaoNaMao/PlatformUI.swift
      - path: PlantaoNaMao/AppLaunch.swift
      - path: PlantaoNaMao/ReminderPlan.swift
      - path: PlantaoNaMao/ShiftNotifications.swift
      - path: PlantaoNaMaoMac/MacPDFReport.swift
      - path: PlantaoNaMaoMac/Auth/CrossPlatformOAuth.swift
      - path: PlantaoNaMaoMac/Auth/MacOAuthConfiguration.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: ''
  PlantaoNaMaoMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: PlantaoNaMaoMacUITests
    dependencies:
      - target: PlantaoNaMaoMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.macos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: ''

schemes:
  PlantaoNaMao:
    build:
      targets:
        PlantaoNaMao: all
        PlantaoNaMaoTests: [test]
        PlantaoNaMaoUITests: [test]
    test:
      targets: [PlantaoNaMaoTests, PlantaoNaMaoUITests]
      gatherCoverageData: true
    archive:
      config: Release

  PlantaoNaMaoMac:
    build:
      targets:
        PlantaoNaMaoMac: all
        PlantaoNaMaoMacTests: [test]
        PlantaoNaMaoMacUITests: [test]
    test:
      targets: [PlantaoNaMaoMacTests, PlantaoNaMaoMacUITests]
    archive:
      config: Release
