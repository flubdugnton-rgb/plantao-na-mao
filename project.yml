name: PlantaoNaMao
options:
  bundleIdPrefix: com.plantaonamao
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: '10.1.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '1.3'
    CURRENT_PROJECT_VERSION: '5'
    TARGETED_DEVICE_FAMILY: '1,2'
    APP_GROUP_IDENTIFIER: group.com.plantaonamao.shared
targets:
  PlantaoNaMao:
    type: application
    platform: iOS
    sources:
      - path: PlantaoNaMao
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: PlantaoNaMaoWidgets
        embed: true
    entitlements:
      path: PlantaoNaMao/Plantao.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
    info:
      path: PlantaoNaMao/Info.plist
      properties:
        CFBundleDisplayName: Plantão na Mão
        CFBundleDevelopmentRegion: pt_BR
        CFBundleLocalizations: [pt_BR]
        SharedAppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        GIDClientID: 240965240632-fd5s8htiparn8kk84rpctc1ggrfrur2g.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes: [plantaonamao]
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.240965240632-fd5s8htiparn8kk84rpctc1ggrfrur2g
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app
        PRODUCT_NAME: PlantaoNaMao
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Plantão na Mão
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PlantaoNaMaoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PlantaoNaMaoWidgets
      - path: PlantaoNaMao/Models.swift
      - path: PlantaoNaMao/FinanceModels.swift
      - path: PlantaoNaMao/WidgetData.swift
      - path: PlantaoNaMao/ColorPalette.swift
    entitlements:
      path: PlantaoNaMaoWidgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
    info:
      path: PlantaoNaMaoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plantão na Mão
        SharedAppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app.widgets
        PRODUCT_NAME: PlantaoNaMaoWidgets
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  PlantaoNaMaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlantaoNaMaoTests
    dependencies:
      - target: PlantaoNaMao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app.tests
        GENERATE_INFOPLIST_FILE: YES
  PlantaoNaMaoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlantaoNaMaoUITests
    dependencies:
      - target: PlantaoNaMao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PlantaoNaMao:
    build:
      targets:
        PlantaoNaMao: all
        PlantaoNaMaoTests: [test]
        PlantaoNaMaoUITests: [test]
    test:
      targets: [PlantaoNaMaoTests, PlantaoNaMaoUITests]
      gatherCoverageData: true
    archive:
      config: Release
