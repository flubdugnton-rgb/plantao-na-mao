name: PlantaoNaMao
options:
  bundleIdPrefix: com.plantaonamao
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '2'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PlantaoNaMao:
    type: application
    platform: iOS
    sources:
      - path: PlantaoNaMao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app
        PRODUCT_NAME: PlantaoNaMao
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plantão na Mão
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PlantaoNaMaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlantaoNaMaoTests
    dependencies:
      - target: PlantaoNaMao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plantaonamao.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PlantaoNaMao:
    build:
      targets:
        PlantaoNaMao: all
        PlantaoNaMaoTests: [test]
    test:
      targets: [PlantaoNaMaoTests]
      gatherCoverageData: true
    archive:
      config: Release
